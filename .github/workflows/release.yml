name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Prepare Puppeteer Chromium
        shell: pwsh
        run: |
          $source = "node_modules/puppeteer/.local-chromium/win64-1045629"
          if (-not (Test-Path "$source/chrome-win/chrome.exe")) {
            throw "Puppeteer Chromium revision 1045629 was not installed at $source"
          }
          New-Item -ItemType Directory -Force "app/.local-chromium" | Out-Null
          Copy-Item -Recurse -Force $source "app/.local-chromium/"

      - name: Build Windows installer
        run: yarn electron:build --publish never

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $publishDir = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force $publishDir | Out-Null

          $installer = Get-ChildItem "dist_electron" -Filter "*Setup $version.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer for version $version was not produced"
          }
          $blockmap = Get-Item "$($installer.FullName).blockmap" -ErrorAction Stop
          $portableArchive = Get-ChildItem "dist_electron" -Filter "*.zip" | Select-Object -First 1
          if (-not $portableArchive) {
            throw "Portable ZIP for version $version was not produced"
          }
          $installerName = "selling-goods-manager-product-by-Yuan-Setup-$version.exe"
          $archiveName = "selling-goods-manager-portable-$version.zip"
          Copy-Item $installer.FullName (Join-Path $publishDir $installerName)
          Copy-Item $blockmap.FullName (Join-Path $publishDir "$($installerName).blockmap")
          Copy-Item $portableArchive.FullName (Join-Path $publishDir $archiveName)
          Copy-Item "dist_electron/latest.yml" (Join-Path $publishDir "latest.yml")

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Windows installer and portable ZIP release $tag." --verify-tag --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create GitHub Release $tag"
            }
          }
          gh release upload $tag `
            (Join-Path $publishDir $installerName) `
            (Join-Path $publishDir "$($installerName).blockmap") `
            (Join-Path $publishDir $archiveName) `
            (Join-Path $publishDir "latest.yml") `
            --clobber `
            --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload all assets to GitHub Release $tag"
          }
          $uploadedAssets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify assets for GitHub Release $tag"
          }
          foreach ($asset in @($installerName, "$($installerName).blockmap", $archiveName, "latest.yml")) {
            if ($uploadedAssets -notcontains $asset) {
              throw "GitHub Release $tag is missing asset $asset"
            }
          }
